name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ayeda_test
          POSTGRES_USER: ayeda
          POSTGRES_PASSWORD: ayeda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayeda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: ayeda
      DB_PASSWORD: ayeda
      DB_DATABASE: ayeda_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      STORAGE_TYPE: local
      BASE_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter backend migration:run
      - run: pnpm --filter backend lint
      - run: pnpm --filter backend type-check
      - run: pnpm --filter backend test
      - run: pnpm --filter backend test:e2e
      - run: pnpm --filter backend build
